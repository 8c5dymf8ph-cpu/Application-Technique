# Installe la base de l'hôtel sans passer par l'éditeur SQL du navigateur.
#
# L'éditeur oblige à coller quatorze fichiers à la main, et il lui arrive de
# rejouer un contenu périmé : on croit coller un fichier, c'est le précédent
# qui part. Ici les fichiers sont joués dans l'ordre, par la machine, depuis
# donnees/installation/ordre.txt.
#
# Se déclenche à la main : onglet Actions → « Installer la base » → Run workflow.
name: Installer la base

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Taper INSTALLER pour confirmer"
        required: true
        default: ""
      repartir_de_zero:
        description: "Effacer d'abord la base — à cocher si une installation a été commencée"
        type: boolean
        required: false
        default: false

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v5

      - name: Vérifier la confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "INSTALLER" ]; then
            echo "Taper INSTALLER dans la case de confirmation." >&2
            exit 1
          fi

      - name: Vérifier que la clé de connexion est posée
        run: |
          if [ -z "${{ secrets.INSTALL_DATABASE_URL }}" ]; then
            echo "Le secret INSTALL_DATABASE_URL est absent." >&2
            echo "Settings → Secrets and variables → Actions → New repository secret." >&2
            exit 1
          fi

      - name: Examiner la chaîne de connexion
        env:
          PGURL: ${{ secrets.INSTALL_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, unquote

          brute = os.environ["PGURL"].strip()

          def stop(*messages):
              print("")
              for m in messages:
                  print(f"  • {m}", file=sys.stderr)
              sys.exit(1)

          # Le texte d'exemple se teste AVANT l'analyse : ses crochets font
          # prendre le mot de passe pour une adresse IPv6, et l'analyse échoue
          # sur une erreur qui n'explique rien.
          if "[" in brute or "]" in brute:
              stop(
                  "La chaîne contient encore des crochets, donc le texte "
                  "d'exemple [YOUR-PASSWORD]. Il faut le remplacer par le vrai "
                  "mot de passe de la base — ou en poser un nouveau : Supabase "
                  "→ Settings → Database → Reset database password."
              )

          soucis = []

          # Un « @ » non encodé dans le mot de passe couperait l'adresse au
          # mauvais endroit : on le repère avant de faire confiance au reste.
          if brute.count("@") > 1:
              soucis.append(
                  "Le mot de passe contient un « @ » : il doit être encodé "
                  "(%40), ou remplacé par un mot de passe sans caractère spécial."
              )

          try:
              u = urlsplit(brute)
          except ValueError as e:
              stop(f"La chaîne n'est pas lisible ({e}).", *soucis)
          hote, port, base = u.hostname or "", u.port, (u.path or "/").lstrip("/")
          user = unquote(u.username or "")
          mdp = unquote(u.password or "")

          print(f"hôte          : {hote}")
          print(f"port          : {port}")
          print(f"base          : {base}")
          print(f"utilisateur   : {user}")
          print(f"mot de passe  : {len(mdp)} caractères")

          if "pooler.supabase.com" not in hote:
              soucis.append(
                  "L'hôte n'est pas celui du pooler. Prendre la chaîne "
                  "« Session pooler » dans Supabase → Connect → Direct."
              )
          if "." not in user:
              soucis.append(
                  f"L'utilisateur est « {user} », sans la référence du projet. "
                  "Le pooler attend « postgres.<référence-du-projet> » : la "
                  "chaîne a été modifiée, ou ce n'est pas celle du Session pooler."
              )
          if not mdp:
              soucis.append("Il n'y a pas de mot de passe dans la chaîne.")
          elif mdp.upper().strip("[]") in ("YOUR-PASSWORD", "YOUR_PASSWORD", "PASSWORD"):
              soucis.append(
                  "Le mot de passe est resté le texte d'exemple [YOUR-PASSWORD]. "
                  "Il faut le remplacer par le vrai mot de passe de la base."
              )

          if soucis:
              print("")
              for s in soucis:
                  print(f"  • {s}", file=sys.stderr)
              sys.exit(1)
          print("")
          print("La chaîne a la bonne forme.")
          PY

      - name: Effacer la base, si demandé
        if: ${{ inputs.repartir_de_zero }}
        env:
          PGURL: ${{ secrets.INSTALL_DATABASE_URL }}
        run: |
          set -e
          psql "$PGURL" -v ON_ERROR_STOP=1 --quiet --no-psqlrc \
            -f donnees/installation/0-tout-effacer.sql

      - name: Jouer les fichiers, dans l'ordre
        env:
          # Jamais affichée : GitHub masque ses secrets dans les journaux, et
          # aucune commande ici ne l'écrit.
          PGURL: ${{ secrets.INSTALL_DATABASE_URL }}
        run: |
          set -e
          cd donnees/installation
          grep -v '^#' ordre.txt | grep -v '^$' | while read -r f; do
            echo "::group::$f"
            psql "$PGURL" -v ON_ERROR_STOP=1 --quiet --no-psqlrc -f "$f"
            echo "::endgroup::"
          done

      - name: Compter ce qui est en place
        env:
          PGURL: ${{ secrets.INSTALL_DATABASE_URL }}
        run: |
          psql "$PGURL" --quiet --no-psqlrc --no-align --tuples-only -c "
            select 'anomalies   : ' || count(*) || ' sur 670'  from anomalies
            union all
            select 'produits    : ' || count(*) || ' sur 36'   from produits
            union all
            select 'bouteilles  : ' || count(*) || ' dossiers sur 17'
              from incidents_bouteille
            union all
            select 'emplacements: ' || count(*) || ' sur 70'   from emplacements"
